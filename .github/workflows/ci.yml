name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  vision-test:
    name: Vision tests ([vision] extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (with vision extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vision]"

      - name: Run vision-marked tests
        run: pytest -m vision -q

  docker-build:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t trust-engine:ci .

      - name: Smoke test the running container
        run: |
          docker run -d --name trust-engine-ci -p 8000:8000 trust-engine:ci
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)" = "200"

      - name: Container logs
        if: always()
        run: docker logs trust-engine-ci || true

      - name: Tear down
        if: always()
        run: docker rm -f trust-engine-ci || true
