[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-engine"
version = "0.1.0"
description = "A Python engine for computing and managing trust scores."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Heavy computer-vision backends. Not installed by default so the base image and
# CI stay slim; enable with `pip install .[vision]`.
vision = [
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "numpy>=1.24",
    "httpx>=0.27",
]

[project.scripts]
trust-engine-api = "trust_engine.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "vision: tests that require the optional [vision] extra",
]
